<html>
<head>
<meta charset="UTF-8" />
<title>Jeff Molofee — Developer Portfolio</title>
<link rel="stylesheet" type="text/css" href="css/style.css" />
<meta name="apple-itunes-app" content="app-id=913831902" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* ── Monochrome Print: black canvas, crisp white print-card boxes, sharp serif, full-color screenshots ── */
:root {
	--page-bg: #000000;
	--text: #161616;
	--muted: #4a4a4a;
	--heading: #0a0a0a;
	--accent: #b3261e;
	--card-bg: #ffffff;
	--card-border: #161616;
	--serif: Georgia, 'Times New Roman', Cambria, serif;
}

body { background-color: var(--page-bg); color: var(--text); font-family: var(--serif); }
.master { background: var(--page-bg); }
h1 { color: var(--heading); font-family: var(--serif); }
a, a:visited { color: var(--accent); }
a:hover { color: #7a1a14; }
li { color: var(--muted); }
.site-header { border-bottom: 1px solid #333; }
.project-description { color: var(--muted); }
.features-label { color: var(--accent); font-family: var(--serif); font-style: italic; text-transform: none; letter-spacing: 0; font-size: 13px; }
.press-quotes { color: #6a6a6a; }
.press-quotes a { color: var(--accent); }

.container.wide { max-width: 1280px; }
.project-layout { display: flex; gap: 26px; align-items: flex-start; margin-bottom: 50px; }

.project-sidebar {
	flex: 0 0 230px;
	border: 1px solid var(--card-border);
	border-radius: 0;
	background: var(--card-bg);
	padding: 6px;
	position: sticky;
	top: 16px;
	align-self: flex-start;
}

.section-item {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 8px;
	width: 100%;
	text-align: left;
	background: transparent;
	border: none;
	border-bottom: 1px solid #eee;
	border-radius: 0;
	padding: 13px 12px;
	cursor: pointer;
	font-family: var(--serif);
	font-size: 14px;
	font-weight: 700;
	color: var(--muted);
}
.section-item:last-child { border-bottom: none; }
.section-item:hover { background: #f2f2f2; }
.section-item.active { background: var(--heading); color: #ffffff; }
.section-count { font-size: 11px; font-weight: 400; color: #9a9a9a; }
.section-item.active .section-count { color: #c9c9c9; }

.project-detail {
	flex: 1;
	min-width: 0;
	background: var(--card-bg);
	border: 1px solid var(--card-border);
	border-radius: 0;
	position: relative;
	overflow: hidden;
}

.detail-viewport { padding: 34px 92px 38px; transition: min-height 0.3s ease; }

.detail-inner {
	transform: translateX(0);
	opacity: 1;
}

.carousel-arrow {
	position: absolute;
	top: 0;
	bottom: 0;
	width: 76px;
	display: flex;
	align-items: center;
	justify-content: center;
	background: transparent;
	border: none;
	cursor: pointer;
	font-size: 34px;
	line-height: 1;
	color: rgba(10,10,10,0.14);
	z-index: 5;
	transition: color 0.2s ease, background 0.2s ease;
	font-family: var(--serif);
	user-select: none;
}
.carousel-arrow:hover { color: rgba(10,10,10,0.6); background: rgba(0,0,0,0.035); }
.carousel-arrow.prev { left: 0; }
.carousel-arrow.next { right: 0; }
.carousel-dots { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: #d8d8d8; border: 1px solid #bbb; padding: 0; cursor: pointer; }
.carousel-dot.active { background: var(--heading); border-color: var(--heading); }
.project-detail h1 { font-size: 32px; font-weight: 700; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.detail-tag {
	font-size: 10px;
	font-weight: 700;
	letter-spacing: 1px;
	padding: 3px 11px;
	border-radius: 0;
	border: 1px solid var(--heading);
	background: transparent;
	color: var(--heading);
	text-transform: uppercase;
	font-family: Georgia, serif;
}

/* Polaroid-framed photo, full color, straight (no tilt, no hover effect) */
.detail-img-box {
	width: 100%;
	max-height: 480px;
	background: #ffffff;
	border: 1px solid #ddd;
	border-radius: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
	margin: 6px 0 26px;
	padding: 14px 14px 30px;
	box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.detail-img-box img {
	max-width: 100%;
	max-height: 400px;
	object-fit: contain;
	display: block;
}
.project-detail .project-description { max-width: 780px; margin-bottom: 20px; font-size: 16px; line-height: 1.7; }
.detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
.project-detail .project-link {
	margin-top: 20px;
	border-radius: 0;
	border: 1px solid var(--heading);
	color: var(--heading);
	background: transparent;
	font-family: var(--serif);
}
.project-detail .project-link:hover { background: var(--heading); border-color: var(--heading); color: #fff; }

@media (max-width: 860px) {
	.project-layout { flex-direction: column; }
	.project-sidebar { width: 100%; flex: 1 1 auto; position: static; }
	.detail-viewport { padding: 24px 52px; }
	.carousel-arrow { width: 44px; font-size: 26px; }
}
</style>
</head>
<body>
<div class="master">
    <div class="container wide">

        <div class="site-header">
            <img src="logo.png" class="noborder" alt="NeHe Logo" />
        </div>

        <div class="project-layout">
            <div class="project-sidebar" id="sidebar"></div>
            <div class="project-detail">
                <button class="carousel-arrow prev" id="prevArrow" aria-label="Previous app">&#10094;</button>
                <div class="detail-viewport">
                    <div class="detail-inner" id="detail-inner"></div>
                    <div class="carousel-dots" id="dots"></div>
                </div>
                <button class="carousel-arrow next" id="nextArrow" aria-label="Next app">&#10095;</button>
            </div>
        </div>

    </div><!-- /container -->

    <div class="footer">
      <div class="footer-inner">
        <div class="footer-col">
            <h2>About</h2>
            Programmer, Father, Apple Fan<br>
            Used to run <a href="http://nehe.gamedev.net">nehe.gamedev.net</a>
        </div>
        <div class="footer-col">
            <h2>Contact</h2>
            <a href="https://www.linkedin.com/in/jmolofee/">LinkedIn</a><br>
            <a href="https://github.com/NeHeGL">GitHub</a><br>
            <a href="https://twitter.com/NeHe">Twitter</a>
        </div>
        <div class="footer-col">
            <h2>Misc</h2>
            <b>iOS Apps</b> are no longer available<br>
            Thank you for visiting my site!
        </div>
        <div class="footer-col footer-logo">
            <img src="apple.png" class="noborder" alt="Apple logo" /><br><br>
            <b>2014 - 2026 Jeff Molofee</b>
        </div>
      </div><!-- /footer-inner -->
    </div>

</div>

<script src="js/projects-data.js"></script>
<script>
function tagsHtml(tags) {
	return tags.map(function (t) { return '<span class="detail-tag">' + t + '</span>'; }).join('');
}
function featuresHtml(features) {
	return features.map(function (group) {
		return '<div><div class="features-label">' + group.label + '</div><ul>' +
			group.items.map(function (i) { return '<li>' + i + '</li>'; }).join('') +
			'</ul></div>';
	}).join('');
}
function pressHtml(p) {
	if (!p) return '';
	return '<div class="press-quotes" style="margin-top:16px;">' +
		p.map(function (q) { return q.source + ' &mdash; ' + q.html; }).join('<br>') +
		'</div>';
}
var sections = {};
var order = [];
PROJECTS.forEach(function (p) {
	if (!sections[p.section]) { sections[p.section] = []; order.push(p.section); }
	sections[p.section].push(p);
});

if (sections['Windows Apps']) {
	sections['Windows Apps'].sort(function (a, b) {
		return a.title.toLowerCase().localeCompare(b.title.toLowerCase());
	});
}

var activeSectionName = order[0];
var activeProjectId = sections[activeSectionName][0].id;
var animating = false;

function renderSidebar() {
	var navHtml = order.map(function (sectionName) {
		var cls = 'section-item' + (sectionName === activeSectionName ? ' active' : '');
		return '<button class="' + cls + '" data-section="' + sectionName + '">' +
			'<span>' + sectionName + '</span>' +
			'<span class="section-count">' + sections[sectionName].length + '</span>' +
		'</button>';
	}).join('');
	document.getElementById('sidebar').innerHTML = navHtml;

	document.querySelectorAll('.section-item').forEach(function (btn) {
		btn.addEventListener('click', function () {
			var sectionName = btn.getAttribute('data-section');
			if (sectionName === activeSectionName) return;
			activeSectionName = sectionName;
			activeProjectId = sections[sectionName][0].id;
			document.querySelectorAll('.section-item').forEach(function (b) { b.classList.remove('active'); });
			btn.classList.add('active');
			crossfadeTo(sections[sectionName][0]);
			if (window.innerWidth <= 860) {
				document.querySelector('.project-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
			}
		});
	});
}

function detailHtml(p) {
	return '' +
		'<h1>' + p.title + '</h1>' +
		'<div class="detail-meta">' + tagsHtml(p.tags) + '</div>' +
		'<div class="detail-img-box"><img src="' + p.image + '" alt="' + p.title + '" /></div>' +
		'<p class="project-description">' + p.description + '</p>' +
		'<div class="detail-cols">' + featuresHtml(p.features) + '</div>' +
		(p.link ? '<a class="project-link" href="' + p.link + '">View Source on GitHub</a>' : '') +
		pressHtml(p.pressQuotes);
}

function renderDots() {
	var list = sections[activeSectionName];
	document.getElementById('dots').innerHTML = list.length <= 1 ? '' : list.map(function (p) {
		var cls = 'carousel-dot' + (p.id === activeProjectId ? ' active' : '');
		return '<button class="' + cls + '" data-id="' + p.id + '" aria-label="' + p.title + '"></button>';
	}).join('');
	document.querySelectorAll('.carousel-dot').forEach(function (dot) {
		dot.addEventListener('click', function () {
			var list = sections[activeSectionName];
			var targetId = dot.getAttribute('data-id');
			var fromIdx = list.findIndex(function (p) { return p.id === activeProjectId; });
			var toIdx = list.findIndex(function (p) { return p.id === targetId; });
			if (toIdx === fromIdx) return;
			slideTo(toIdx > fromIdx ? 1 : -1);
		});
	});
}

var heightMeasurer = null;
function measuredHeightFor(p) {
	if (!heightMeasurer) {
		heightMeasurer = document.createElement('div');
		heightMeasurer.style.position = 'absolute';
		heightMeasurer.style.visibility = 'hidden';
		heightMeasurer.style.pointerEvents = 'none';
		heightMeasurer.style.left = '-9999px';
		heightMeasurer.className = 'detail-inner';
		document.body.appendChild(heightMeasurer);
	}
	heightMeasurer.style.width = document.querySelector('.detail-viewport').clientWidth + 'px';
	heightMeasurer.innerHTML = detailHtml(p);
	return heightMeasurer.scrollHeight;
}

/* Each project gets its OWN natural height (not one size fixed to the
   tallest project) -- min-height animates smoothly via the CSS
   transition above, so switching between a short and a long entry
   eases the panel to the right size instead of jumping or leaving a
   huge dead-space gap that pushes the footer down. */
function renderDetail(p) {
	document.getElementById('detail-inner').innerHTML = detailHtml(p);
	renderDots();
	var viewport = document.querySelector('.detail-viewport');
	viewport.style.minHeight = (measuredHeightFor(p) + 34) + 'px';
}

/* Directional slide -- current content exits toward the direction of
   travel while fading, then the new project's content enters from the
   opposite edge and eases into the center. */
function slideTo(direction) {
	if (animating) return;
	var list = sections[activeSectionName];
	var idx = list.findIndex(function (p) { return p.id === activeProjectId; });
	var nextIdx = (idx + direction + list.length) % list.length;
	var project = list[nextIdx];
	animating = true;

	var inner = document.getElementById('detail-inner');
	inner.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
	inner.style.transform = 'translateX(' + (direction > 0 ? '-46px' : '46px') + ')';
	inner.style.opacity = '0';

	setTimeout(function () {
		activeProjectId = project.id;
		renderDetail(project);
		inner.style.transition = 'none';
		inner.style.transform = 'translateX(' + (direction > 0 ? '46px' : '-46px') + ')';
		// eslint-disable-next-line no-unused-expressions
		inner.offsetHeight; /* force reflow so the snap above isn't animated */
		inner.style.transition = 'transform 0.34s cubic-bezier(.22,.61,.36,1), opacity 0.34s ease';
		inner.style.transform = 'translateX(0)';
		inner.style.opacity = '1';
		setTimeout(function () { animating = false; }, 340);
	}, 220);
}

/* Plain crossfade for switching sections -- there's no natural left/right
   relationship between unrelated categories, so no directional slide. */
function crossfadeTo(project) {
	if (animating) return;
	animating = true;
	var inner = document.getElementById('detail-inner');
	inner.style.transition = 'opacity 0.18s ease';
	inner.style.opacity = '0';
	setTimeout(function () {
		renderDetail(project);
		inner.style.transition = 'none';
		inner.offsetHeight;
		inner.style.transition = 'opacity 0.3s ease';
		inner.style.opacity = '1';
		setTimeout(function () { animating = false; }, 300);
	}, 180);
}

document.getElementById('prevArrow').addEventListener('click', function () { slideTo(-1); });
document.getElementById('nextArrow').addEventListener('click', function () { slideTo(1); });
document.addEventListener('keydown', function (e) {
	if (e.key === 'ArrowLeft') slideTo(-1);
	else if (e.key === 'ArrowRight') slideTo(1);
});

var resizeTimer;
window.addEventListener('resize', function () {
	clearTimeout(resizeTimer);
	resizeTimer = setTimeout(function () {
		var current = PROJECTS.filter(function (p) { return p.id === activeProjectId; })[0];
		document.querySelector('.detail-viewport').style.minHeight = (measuredHeightFor(current) + 34) + 'px';
	}, 200);
});

renderSidebar();
renderDetail(sections[activeSectionName][0]);
</script>
</body>
</html>
