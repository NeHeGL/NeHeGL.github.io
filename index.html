<html>
<head>
<meta charset="UTF-8" />
<title>Jeff Molofee — Developer Portfolio</title>
<link rel="stylesheet" type="text/css" href="css/style.css" />
<meta name="apple-itunes-app" content="app-id=913831902" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* ── Sidebar list + single detail pane — only one full write-up on screen at a time ── */
.container.wide { max-width: 1280px; }

.project-layout {
	display: flex;
	gap: 30px;
	align-items: flex-start;
	margin-bottom: 50px;
}

.project-sidebar {
	flex: 0 0 300px;
	position: sticky;
	top: 20px;
	border: 1px solid #1c2a3a;
	border-radius: 14px;
	background: #0f1623;
	padding: 8px;
}

.project-sidebar-heading {
	font-size: 10.5px;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 1.5px;
	color: #4a90d9;
	padding: 12px 12px 6px;
}

.nav-item {
	display: flex;
	align-items: center;
	gap: 12px;
	width: 100%;
	text-align: left;
	background: transparent;
	border: none;
	border-radius: 8px;
	padding: 8px 10px;
	cursor: pointer;
	font-family: inherit;
	color: #b0b8c6;
	margin-bottom: 2px;
}
.nav-item:hover { background: #142032; }
.nav-item.active { background: #17324f; color: #ffffff; }

.nav-thumb {
	flex: 0 0 40px;
	width: 40px;
	height: 40px;
	background: #060a12;
	border-radius: 6px;
	border: 1px solid #1e2d42;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}
.nav-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }

.nav-text { min-width: 0; flex: 1; }
.nav-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-tag { font-size: 10.5px; color: #5a6577; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.project-detail {
	flex: 1;
	min-width: 0;
	background: #0f1623;
	border: 1px solid #1c2a3a;
	border-radius: 14px;
	padding: 30px 34px 34px;
}
.project-detail h1 { font-size: 26px; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.detail-tag {
	font-size: 10px;
	font-weight: 700;
	letter-spacing: 1px;
	padding: 2px 10px;
	border-radius: 20px;
	border: 1px solid #1a3a5c;
	background: #0a1520;
	color: #4a90d9;
	text-transform: uppercase;
}
.detail-img-box {
	width: 100%;
	max-height: 440px;
	background: #060a12;
	border-radius: 10px;
	border: 1px solid #1e2d42;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
	margin-bottom: 20px;
}
.detail-img-box img { max-width: 100%; max-height: 440px; object-fit: contain; display: block; }
.project-detail .project-description { max-width: 780px; margin-bottom: 18px; }
.detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
.project-detail .project-link { margin-top: 20px; }

@media (max-width: 860px) {
	.project-layout { flex-direction: column; }
	.project-sidebar { position: static; width: 100%; flex: 1 1 auto; }
	.project-detail { padding: 24px; }
}
</style>
</head>
<body>
<div class="master">
    <div class="container wide">

        <div class="site-header">
            <img src="logo.png" class="noborder" alt="NeHe Logo" />
        </div>

        <div class="project-layout">
            <div class="project-sidebar" id="sidebar"></div>
            <div class="project-detail" id="detail"></div>
        </div>

    </div><!-- /container -->

    <div class="footer">
      <div class="footer-inner">
        <div class="footer-col">
            <h2>About</h2>
            Programmer, Father, Apple Fan<br>
            Used to run <a href="http://nehe.gamedev.net">nehe.gamedev.net</a>
        </div>
        <div class="footer-col">
            <h2>Contact</h2>
            <a href="https://www.linkedin.com/in/jmolofee/">LinkedIn</a><br>
            <a href="https://github.com/NeHeGL">GitHub</a><br>
            <a href="https://twitter.com/NeHe">Twitter</a>
        </div>
        <div class="footer-col">
            <h2>Misc</h2>
            <b>iOS Apps</b> are no longer available<br>
            Thank you for visiting my site!
        </div>
        <div class="footer-col footer-logo">
            <img src="apple.png" class="noborder" alt="Apple logo" /><br><br>
            <b>2014 - 2026 Jeff Molofee</b>
        </div>
      </div><!-- /footer-inner -->
    </div>

</div>

<script src="js/projects-data.js"></script>
<script>
function tagsHtml(tags) {
	return tags.map(function (t) { return '<span class="detail-tag">' + t + '</span>'; }).join('');
}
function featuresHtml(features) {
	return features.map(function (group) {
		return '<div><div class="features-label">' + group.label + '</div><ul>' +
			group.items.map(function (i) { return '<li>' + i + '</li>'; }).join('') +
			'</ul></div>';
	}).join('');
}
function pressHtml(p) {
	if (!p) return '';
	return '<div class="press-quotes" style="margin-top:16px;">' +
		p.map(function (q) { return q.source + ' &mdash; ' + q.html; }).join('<br>') +
		'</div>';
}
var sections = {};
var order = [];
PROJECTS.forEach(function (p) {
	if (!sections[p.section]) { sections[p.section] = []; order.push(p.section); }
	sections[p.section].push(p);
});

var navHtml = '';
order.forEach(function (sectionName) {
	navHtml += '<div class="project-sidebar-heading">' + sectionName + '</div>';
	navHtml += sections[sectionName].map(function (p) {
		return '' +
			'<button class="nav-item" data-id="' + p.id + '">' +
				'<div class="nav-thumb"><img src="' + p.image + '" alt="" loading="lazy" /></div>' +
				'<div class="nav-text">' +
					'<div class="nav-title">' + p.title + '</div>' +
					'<span class="nav-tag">' + p.tags.join(' · ') + '</span>' +
				'</div>' +
			'</button>';
	}).join('');
});
document.getElementById('sidebar').innerHTML = navHtml;

function renderDetail(p) {
	document.getElementById('detail').innerHTML = '' +
		'<h1>' + p.title + '</h1>' +
		'<div class="detail-meta">' + tagsHtml(p.tags) + '</div>' +
		'<div class="detail-img-box"><img src="' + p.image + '" alt="' + p.title + '" /></div>' +
		'<p class="project-description">' + p.description + '</p>' +
		'<div class="detail-cols">' + featuresHtml(p.features) + '</div>' +
		(p.link ? '<a class="project-link" href="' + p.link + '">View Source on GitHub</a>' : '') +
		pressHtml(p.pressQuotes);
}

var navItems = document.querySelectorAll('.nav-item');
navItems.forEach(function (btn) {
	btn.addEventListener('click', function () {
		navItems.forEach(function (b) { b.classList.remove('active'); });
		btn.classList.add('active');
		var project = PROJECTS.filter(function (p) { return p.id === btn.getAttribute('data-id'); })[0];
		renderDetail(project);
		if (window.innerWidth <= 860) {
			document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
		}
	});
});

navItems[0].classList.add('active');
renderDetail(PROJECTS[0]);
</script>
</body>
</html>
